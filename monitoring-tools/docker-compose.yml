
services:

  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: PostgresLocal@123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitoring-network

  # Redis Cache
  redis:
    image: redis:7
    container_name: redis-cache
    restart: unless-stopped
    command: redis-server --requirepass RedisLocal@123 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - monitoring-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--config.file=/etc/prometheus/generated/prometheus.yml'
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /etc/prometheus/generated/prometheus.yml <<'EOF'
        global:
          scrape_interval: 15s
        scrape_configs:
          - job_name: prometheus
            static_configs:
              - targets: ['localhost:9090']
          - job_name: spring-boot
            metrics_path: /actuator/prometheus
            static_configs:
              - targets: ['host.docker.internal:8080']
        EOF
        exec /bin/prometheus \
          --config.file=/etc/prometheus/generated/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - monitoring-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: GrafanaLocal@123
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring-network

  # Splunk Enterprise
  splunk:
    image: splunk/splunk:latest
    container_name: splunk
    restart: unless-stopped
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_PASSWORD: SplunkLocal@123
    ports:
      - "8000:8000"
      - "8089:8089"
      - "8088:8088"
      - "9997:9997"
    volumes:
      - splunk_etc:/opt/splunk/etc
      - splunk_var:/opt/splunk/var
    networks:
      - monitoring-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  splunk_etc:
  splunk_var:

networks:
  monitoring-network:
    driver: bridge