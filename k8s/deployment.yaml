apiVersion: apps/v1
kind: Deployment

metadata:
  name: book-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: book-api

  template:
    metadata:
      labels:
        app: book-api

    spec:
      containers:
        - name: book-api
          image: book-crud-api:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8082